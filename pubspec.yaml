name: booru_app
description: App for yande and konachan

version: 0.2.6+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  adaptive_aura: ^0.0.5
  app_links: ^7.0.0
  auto_route: ^11.1.0
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  darq: ^2.0.0
  devicelocale: ^0.8.2
  dio: ^5.9.0
  enum_to_string: ^2.2.1
  expandable: ^5.0.1
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^19.5.0
  flutter_snake_navigationbar: ^0.6.1
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.2.2
  image_gallery_saver: ^2.0.3
  masonry_grid: ^1.0.0
  open_file: ^3.0.1
  overlay_support: ^2.1.0
  package_info: ^2.0.2
  path_provider:
  path: ^1.7.0
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  pull_to_refresh: ^2.0.0
  rxdart: ^0.28.0
  settings_ui: ^2.0.2
  shadcn_ui: ^0.43.3
  shared_preferences: ^2.5.4
  sliding_up_panel: ^2.0.0+1
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  font_awesome_flutter: ^10.12.0
  filepicker_windows: ^2.1.4
  fluent_ui: ^4.12.0
  window_manager: ^0.5.1
  xml: ^6.5.0

dev_dependencies:
  build_runner:
  flutter_test:
    sdk: flutter

  auto_route_generator:
  # for watching files and rebuilding on changes
  # dart run lean_builder watch
  lean_builder:

dependency_overrides:
  flutter_local_notifications_windows:
    path: packages/flutter_local_notifications_windows

flutter:
  uses-material-design: true
  assets:
    - resources/images/app_icon.png

# dart run flutter_launcher_icons:generate
lutter_launcher_icons:
  windows:
    generate: true
    image_path: "resources/images/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
